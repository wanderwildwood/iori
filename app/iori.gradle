// Home (iori): everything that makes this build iori rather than inkOS.
//
// Applied by one line at the end of app/build.gradle.kts, so upstream's own values are already
// set when this runs and can be read before they are replaced. Upstream's signing block is left
// as it is: it reads KEYSTORE_* from the environment, which the build script fills from
// signing/. Without them the release comes out unsigned. See IORI.md.

def upstreamVersionCode = android.defaultConfig.versionCode

android {
    defaultConfig {
        // Upstream's migrations are keyed to upstream's version codes, so they are fed the code
        // of the base this build actually contains, never iori's own.
        buildConfigField "int", "UPSTREAM_VERSION_CODE", "${upstreamVersionCode}"

        applicationId "com.wanderwildwood.iori"
        versionCode 3
        versionName "1.0.1"
    }

    buildTypes {
        debug {
            resValue "string", "app_name", "Home Debug"
        }
        release {
            resValue "string", "app_name", "Home"
            proguardFile "src/iori/proguard-iori.pro"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/iori/java"
        // The list of apps behind "Your apps" (tools/make-apps-list.py writes it).
        main.assets.srcDirs += "src/iori/assets"
        // Build-type resources outrank main's, so iori's overrides of upstream strings win
        // without a duplicate-resource clash.
        debug.res.srcDirs += "src/iori/res"
        release.res.srcDirs += "src/iori/res"
        test.java.srcDirs += "src/iori/test/java"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

// About Home's Licenses drawer lists what the build actually packs: this plugin walks each
// variant's runtime dependencies and writes res/raw/aboutlibraries.json, one entry per artifact
// with its POM's license. What Gradle cannot see is in config/libraries. Offline: the build
// fetches nothing; the full texts are the family texts in src/iori/res/raw. The app reads the
// file with the shop's LicencesJson.kt (no AboutLibraries library at run time).
// The plugin is 12.2.4, not the 15.3.0 the other apps use: 15.x refuses an Android Gradle
// Plugin older than 8.13 and upstream builds with 8.10. Nothing is fetched: remote license and
// funding lookups are off unless asked for.
// (Set through the getters: inside a Groovy closure `collect { }` is Groovy's own collect.)
def licensesList = extensions.getByName("aboutLibraries")
licensesList.offlineMode.set(true)
licensesList.getCollect().configPath.set(rootProject.file("config"))
licensesList.getCollect().fetchRemoteLicense.set(false)
licensesList.getCollect().fetchRemoteFunding.set(false)
licensesList.getCollect().includePlatform.set(false)
licensesList.getExport().excludeFields.addAll("funding")
